[project]
name = "nyvero"
version = "0.1.0"
description = "A minimal coding agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
nyvero = "nyvero.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
