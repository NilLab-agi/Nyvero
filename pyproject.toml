[project]
name = "nyvero"
version = "0.1.0"
description = "A minimal coding agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv",
]

[project.scripts]
nyvero = "nyvero.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"